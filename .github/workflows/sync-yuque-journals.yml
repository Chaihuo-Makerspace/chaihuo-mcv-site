name: Sync Yuque Journals

on:
  schedule:
    # Check Yuque every 10 minutes. GitHub may delay scheduled runs during peak load.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 定时与手动触发可能撞车：同一时刻只跑一个，后来的排队（不取消），
# 避免并发提交冲突和重复播报
concurrency:
  group: sync-yuque-journals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Sync Yuque journal cards
        id: sync
        run: node scripts/sync-yuque-journals.mjs

      - name: Mark planned route stops as visited from synced journals
        id: stops
        run: node scripts/update-route-stops-from-journals.mjs

      - name: Create stops for new cities from synced journals
        id: newstops
        run: node scripts/create-stops-from-journals.mjs --apply

      # The scripts report what they did as a `summary` output; the commit
      # message is simply what changed, e.g.
      # "新增基地车日记《2026.07.30｜隰县→临汾》 · 基地车抵达临汾 · 新站点 哈尔滨、长春 已自动建站".
      # Falls back to a generic message when no step has details
      # (e.g. cover-only changes).
      - name: Compose commit message
        id: msg
        env:
          SYNC: ${{ steps.sync.outputs.summary }}
          STOPS: ${{ steps.stops.outputs.summary }}
          NEWSTOPS: ${{ steps.newstops.outputs.summary }}
        run: |
          parts=()
          [ -n "$SYNC" ] && parts+=("$SYNC")
          [ -n "$STOPS" ] && parts+=("$STOPS")
          [ -n "$NEWSTOPS" ] && parts+=("$NEWSTOPS")
          if [ ${#parts[@]} -eq 0 ]; then
            msg="同步基地车日记"
          else
            msg="$(printf '%s · ' "${parts[@]}")"
            msg="${msg% · }"
          fi
          echo "message=$msg" >> "$GITHUB_OUTPUT"

      - name: Commit synced data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.msg.outputs.message }}
          file_pattern: src/data/yuque-journals.json src/data/geocode-cache.json src/data/city-coordinates.json public/yuque-journals/* src/content/stops/*.md scripts/location-city-aliases.json src/features/route-map/visited-provinces.ts

      # 地图位置真的变了（抵达新城/建新站）才往「柴火基地车」群播报；
      # 仅同步日记卡片时保持安静。播报失败不影响同步主流程。
      - name: Notify Feishu group when the map location changed
        if: ${{ steps.stops.outputs.cities != '' || steps.newstops.outputs.cities != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          ARRIVAL_CITIES: ${{ steps.stops.outputs.cities }}
          NEW_STOP_CITIES: ${{ steps.newstops.outputs.cities }}
        run: node scripts/notify-feishu-location.mjs
