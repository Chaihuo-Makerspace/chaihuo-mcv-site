services:
  web:
    build: .
    ports:
      - "4321:4321"
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - NODE_ENV=production
      - LIVE_DATA_DIR=/data/live
    volumes:
      # 抓拍数据：宿主机目录 bind mount，重建/重启容器不丢，web 只读
      - ./data/live:/data/live:ro
    restart: unless-stopped

  # 基地车摄像头定时抓拍 worker：同一镜像，跑循环脚本。
  # 凭证通过服务器 shell 环境或项目目录 .env 注入（${VAR:-} 缺省为空，
  # 未配置时 capture 挂起等待，不影响 web 部署）。凭证只给这个容器。
  # 手动触发一次：docker compose exec capture node scripts/live-capture-loop.mjs --once
  capture:
    build: .
    command: node scripts/live-capture-loop.mjs
    environment:
      - LIVE_DATA_DIR=/data/live
      - EZVIZ_APP_KEY=${EZVIZ_APP_KEY:-}
      - EZVIZ_APP_SECRET=${EZVIZ_APP_SECRET:-}
      - EZVIZ_DEVICE_SERIAL=${EZVIZ_DEVICE_SERIAL:-}
      - LIVE_INTERVAL_MINUTES=${LIVE_INTERVAL_MINUTES:-3}
      - LIVE_KEEP_DAYS=${LIVE_KEEP_DAYS:-30}
    volumes:
      - ./data/live:/data/live
    restart: unless-stopped
